<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Phần Mềm & Tool Miễn Phí</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        h1 { text-align: center; color: #0056b3; }
        .tool-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .tool-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .tool-card h3 { margin-top: 0; }
        .btn { display: inline-block; padding: 10px 15px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; }
        .btn:hover { background: #218838; }
    </style>
</head>
<body>
    <h1>DANH SÁCH TOOL CHIA SẺ MIỄN PHÍ</h1>
    
    <div class="tool-list">
        <!-- Card Tool 1 -->
        <div class="tool-card">
            <h3>Tool In Hồ Sơ Hàng Loạt</h3>
            <p>Hỗ trợ tự động in hàng loạt hồ sơ nhanh chóng trong 1 folder.</p>
            <a href="https://aothunin.github.io/freetools/inhangloat.html" class="btn">Xem Hướng Dẫn & Tải</a>
        </div>

        <!-- Card Tool 2 -->
        <div class="tool-card">
            <h3>Tool Crop ảnh 9:16 và che Watermark</h3>
            <p>Công cụ hỗ trợ resize và đổi tên ảnh hàng loạt.</p>
            <a href="tool-b.html" class="btn">Xem Hướng Dẫn & Tải</a>
        </div>
    </div>
</body>
</html>
